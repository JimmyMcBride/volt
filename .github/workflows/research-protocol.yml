name: Volt contracts

on:
  pull_request:
    paths:
      - ".github/workflows/research-protocol.yml"
      - "package.json"
      - "package-lock.json"
      - "language/**"
      - "research/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/research-protocol.yml"
      - "package.json"
      - "package-lock.json"
      - "language/**"
      - "research/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify repository contracts
        run: npm run verify
